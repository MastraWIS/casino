<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TPP Jackpot Tracker — preview</title>
<link rel="stylesheet" href="../../tokens/tokens.css" />
<link rel="stylesheet" href="../cta-button/cta-button.css" />
<link rel="stylesheet" href="jackpot-tracker.css" />
<style>
  body { background: #e6e6e6; padding: 40px; font-family: sans-serif; }
  .page { max-width: 1100px; margin: 0 auto; }
</style>
</head>
<body>
<div class="page">

<section class="tpp-jackpot-tracker" aria-label="Jackpot tracker">
  <div class="tpp-jackpot-tracker__header">
    <h2 class="tpp-jackpot-tracker__title">
      <span class="tpp-jackpot-tracker__live-dot" aria-hidden="true"></span>
      Live Jackpot Tracker
    </h2>
    <span class="tpp-jackpot-tracker__updated">Updated <span id="jt-updated">just now</span></span>
  </div>

  <div class="tpp-jackpot-tracker__hero-grid" id="jt-hero-grid"></div>

  <div class="tpp-jackpot-tracker__table-controls">
    <h3 style="margin:0; font-size:16px;">All tracked jackpots</h3>
    <input type="search" id="jt-search" class="jt-search" placeholder="Search game or provider…" />
  </div>

  <div class="tpp-jackpot-tracker__table-wrap">
    <table class="jt-table">
      <thead>
        <tr>
          <th data-sortable="game">Game</th>
          <th data-sortable="amount">Jackpot</th>
          <th>Provider</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="jt-table-body"></tbody>
    </table>
  </div>

  <div class="tpp-jackpot-tracker__footer">
    <a href="#">View all tracked jackpots →</a>
  </div>
</section>

</div>
<script src="jackpot-tracker.js"></script>
</body>
</html>
