<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TPP CTA Button — preview</title>
<link rel="stylesheet" href="../../tokens/tokens.css" />
<link rel="stylesheet" href="cta-button.css" />
<style>
  body { background: #e6e6e6; padding: 40px; display: flex; gap: 16px; flex-direction: column; align-items: flex-start; font-family: sans-serif; }
</style>
</head>
<body>

<button type="button" class="tpp-btn-cta">
  <span class="tpp-btn-cta__label">Claim bonus</span>
  <span class="tpp-btn-cta__icon-group">
    <span class="tpp-btn-cta__divider" aria-hidden="true"></span>
    <svg class="tpp-btn-cta__chevron" viewBox="0 0 320 512" aria-hidden="true">
      <path d="M310.6 233.4c12.5 12.5 12.5 32.8 0 45.3l-192 192c-12.5 12.5-32.8 12.5-45.3 0s-12.5-32.8 0-45.3L242.7 256 73.4 86.6c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0l192 192z"/>
    </svg>
  </span>
</button>

<button type="button" class="tpp-btn-cta is-hover">
  <span class="tpp-btn-cta__label">Claim bonus</span>
  <span class="tpp-btn-cta__icon-group">
    <span class="tpp-btn-cta__divider" aria-hidden="true"></span>
    <svg class="tpp-btn-cta__chevron" viewBox="0 0 320 512" aria-hidden="true">
      <path d="M310.6 233.4c12.5 12.5 12.5 32.8 0 45.3l-192 192c-12.5 12.5-32.8 12.5-45.3 0s-12.5-32.8 0-45.3L242.7 256 73.4 86.6c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0l192 192z"/>
    </svg>
  </span>
</button>

<button type="button" class="tpp-btn-cta" disabled>
  <span class="tpp-btn-cta__label">Claim bonus</span>
  <span class="tpp-btn-cta__icon-group">
    <span class="tpp-btn-cta__divider" aria-hidden="true"></span>
    <svg class="tpp-btn-cta__chevron" viewBox="0 0 320 512" aria-hidden="true">
      <path d="M310.6 233.4c12.5 12.5 12.5 32.8 0 45.3l-192 192c-12.5 12.5-32.8 12.5-45.3 0s-12.5-32.8 0-45.3L242.7 256 73.4 86.6c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0l192 192z"/>
    </svg>
  </span>
</button>

</body>
</html>
